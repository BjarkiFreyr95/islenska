<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f151b">
<title>Orðaleikur — Icelandic nouns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0f151b; --panel:#17202a; --panel-2:#1d2833; --line:#26323e;
  --ink:#e6eef4; --muted:#8095a4; --dim:#5b6c7a;
  --a:#74b9d8; --b:#e0a860; --c:#b491d6;
  --ok:#57bf92; --no:#e2685f;
  --ui:"Space Grotesk",system-ui,-apple-system,sans-serif;
  --serif:"Newsreader",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);
  display:flex;flex-direction:column;min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:var(--ui);cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible{outline:2px solid var(--a);outline-offset:2px}

.top{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.top .back{font-family:var(--mono);font-size:11px;color:var(--dim);padding:4px 8px;border-radius:5px}
.top .back:hover{color:var(--ink)}
.top .spacer{flex:1}
.pill{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);
  border-radius:20px;padding:4px 10px}
.pill b{color:var(--ok);font-weight:500}
.bar{flex:none;height:2px;background:var(--line);margin:0 16px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--a);width:0;transition:width .3s ease}

main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px;gap:16px}
.wrap{width:100%;max-width:560px;margin:0 auto}

/* ---- menu ---- */
h1{font-family:var(--serif);font-weight:400;font-size:34px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin:0 0 22px;line-height:1.5}
.lanes{display:grid;gap:9px}
.lane{display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px 16px}
.lane:hover{border-color:var(--muted)}
.lane .ico{font-family:var(--serif);font-size:24px;color:var(--a);width:30px;flex:none;text-align:center}
.lane.locked{opacity:.4;cursor:not-allowed}
.lane .t{flex:1;min-width:0}
.lane .t b{display:block;font-weight:500;font-size:15px;margin-bottom:2px}
.lane .t span{font-size:12.5px;color:var(--muted);line-height:1.4}
.lane .n{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none}
.section{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);margin:22px 0 9px}

/* ---- question ---- */
.qword{text-align:center;margin-bottom:4px}
.seg{font-family:var(--serif);font-size:clamp(36px,11vw,58px);line-height:1.08;letter-spacing:-.015em}
.seg.p0{color:var(--a)} .seg.p1{color:var(--b)} .seg.p2{color:var(--c)}
.seg.plain{color:var(--ink)}
.seam{display:inline-block;width:1px;height:.72em;background:var(--line);
  vertical-align:baseline;margin:0 3px}
.qhint{text-align:center;font-family:var(--mono);font-size:11px;color:var(--dim);
  margin-bottom:18px;min-height:15px}

.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:15px 16px;font-size:16px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt:disabled{cursor:default}
.opt .lbl{flex:1;min-width:0}
.opt .tag{font-family:var(--serif);font-size:15px;flex:none}
.opt.right{background:#173026;border-color:var(--ok)}
.opt.wrong{background:#2e1d1c;border-color:var(--no)}
.opt.wrong .tag{color:var(--no)}
.opt.faded{opacity:.4}

/* ---- reveal ---- */
.reveal{margin-top:16px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);padding:14px 16px}
.reveal .rt{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);margin-bottom:10px}
.pieces{display:grid;gap:7px}
.piece{display:flex;align-items:baseline;gap:10px;font-size:14.5px}
.piece .w{font-family:var(--serif);font-size:19px;flex:none;min-width:92px}
.piece.p0 .w{color:var(--a)} .piece.p1 .w{color:var(--b)} .piece.p2 .w{color:var(--c)}
.piece .m{color:var(--muted)}
.piece .known{font-family:var(--mono);font-size:9.5px;color:var(--ok);
  border:1px solid #2c5545;border-radius:3px;padding:1px 5px}
.litc{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);
  font-size:14px;color:var(--muted);line-height:1.5}
.litc b{color:var(--ink);font-weight:500;font-family:var(--serif);font-size:16px}
.builds{margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.7}
.builds b{color:var(--b);font-weight:500}
.famrow{display:flex;align-items:baseline;gap:10px;font-size:14.5px;margin-bottom:6px}
.famrow .fw{font-family:var(--serif);font-size:19px;min-width:108px;flex:none}
.famrow.noun .fw{color:var(--a)} .famrow.verb .fw{color:var(--c)} .famrow.stem .fw{color:var(--b)}
.famrow .fp{font-family:var(--mono);font-size:9.5px;color:var(--dim);min-width:34px}
.famrow .fm{color:var(--muted)}
.deriv{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
  font-size:13px;color:var(--muted);line-height:1.45}
.deriv b{color:var(--b);font-weight:500;font-family:var(--serif);font-size:15px}
.agree{display:grid;gap:8px}
.arow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.arow .phrase{font-family:var(--serif);font-size:19px;flex:none;min-width:150px}
.arow.m .phrase b{color:var(--a)} .arow.f .phrase b{color:var(--b)} .arow.n .phrase b{color:var(--c)}
.arow .phrase b{font-weight:400}
.arow .gl{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.arow .mean{color:var(--muted);font-size:13px}
.degrow{display:grid;gap:7px;margin-top:2px}
.degrow .d{display:flex;align-items:baseline;gap:10px}
.degrow .d b{font-family:var(--serif);font-size:19px;font-weight:400;min-width:120px;flex:none}
.degrow .d.mid b{color:var(--b)} .degrow .d.sup b{color:var(--c)}
.degrow .d span{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.intro{max-width:520px;margin:0 auto}
.intro h2{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 8px}
.intro p{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 14px}
.intro .box{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:14px 16px;margin-bottom:14px}
.intro .box .rt{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.note{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.45;
  border-left:2px solid var(--b);padding-left:10px}

.next{display:block;width:100%;margin-top:14px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:9px;padding:14px;font-size:15px;font-weight:500}
.next:hover{border-color:var(--muted)}

/* ---- summary ---- */
.sum{text-align:center}
.sum h2{font-family:var(--serif);font-weight:400;font-size:34px;margin:0 0 6px}
.sum p{color:var(--muted);font-size:14px;margin:0 0 24px}
.stats{display:flex;gap:30px;justify-content:center;margin-bottom:26px;font-family:var(--mono);font-size:11.5px}
.stats div{color:var(--dim)}
.stats b{display:block;font-size:30px;font-weight:500;color:var(--ink);margin-bottom:3px}
.stats .ok b{color:var(--ok)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row button{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:11px 18px;font-size:14px;font-weight:500}
.row button:hover{border-color:var(--muted)}
.io{width:100%;height:120px;margin-top:14px;background:var(--ground);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:9px;font-family:var(--mono);font-size:10.5px}
.tiny{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:8px}

footer{flex:none;padding:10px 16px 14px;display:flex;align-items:center;gap:8px}
footer .spacer{flex:1}
.tog{font-family:var(--mono);font-size:10.5px;color:var(--dim);border:1px solid var(--line);
  border-radius:6px;padding:5px 9px}
.tog b{color:var(--ink);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <button class="back" id="back" hidden>← back</button>
  <span class="spacer"></span>
  <span class="pill" id="pill"></span>
</div>
<div class="bar"><i id="bar"></i></div>
<main><div class="wrap" id="app"></div></main>
<footer>
  <button class="tog" id="lang">glosses <b>DE</b></button>
  <span class="spacer"></span>
  <button class="tog" id="reset">reset progress</button>
</footer>

<script>
const DATA=__GAME_JSON__;
const W=DATA.words, SUP=DATA.support, DEMO=DATA.demo;
const GENDER_NAME={m:['karlkyn','masculine','maskulin'],
                   f:['kvenkyn','feminine','feminin'],
                   n:['hvorugkyn','neuter','neutrum']};
const DEGREE_NAME={0:['frumstig','positive','Grundstufe'],
                   1:['miðstig','comparative','Komparativ'],
                   2:['efsta stig','superlative','Superlativ']};
const gname=g=>GENDER_NAME[g][0]+' — '+(P.lang==='de'?GENDER_NAME[g][2]:GENDER_NAME[g][1]);
const dname=i=>DEGREE_NAME[i][0]+' · '+(P.lang==='de'?DEGREE_NAME[i][2]:DEGREE_NAME[i][1]);
const pickDemo=g=>{const a=DEMO[g]||[];return a.length?a[Math.floor(Math.random()*a.length)]:null;};
const byId={}; W.forEach(w=>byId[w.id]=w);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- progress ---------- */
const KEY='ordaleikur.v1';
let P={lang:'de', intro:false, s:{}};        // s[id] = {n: seen, k: correct streak, str: 0..5}
try{ const raw=localStorage.getItem(KEY); if(raw) P=Object.assign(P,JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(P)); }catch(e){} }
const st=id=>P.s[id]||(P.s[id]={n:0,k:0,str:0});
const strength=id=>(P.s[id]||{}).str||0;
const known=id=>strength(id)>=3;          // recognised well enough to be used as a hint
const learnt=id=>strength(id)>=5;
const gloss=w=>(P.lang==='de'?w.de:w.en)[0];
const glossOf=id=>byId[id]?gloss(byId[id]):(SUP[id]?SUP[id][P.lang]:id);

/* A compound part counts as known if it is a deck word the player has learnt,
   or a support word whose meaning we can simply show. */
function partKnown(p){ return p.lemma && (byId[p.lemma] ? known(p.lemma) : true); }

/* ---------- lanes ---------- */
const THEMES=[
 {id:'nouns', name:'Nouns', sub:'Vocabulary · Nouns', pick:w=>w.wc!=='adj', lanes:[
  {id:'blocks', name:'Building blocks', ico:'⬡',
   desc:'The stems that combine into the most other words. Learn these first.',
   pick:w=>w.prod>0 && !w.parts.length,
   sort:(a,b)=>b.prod-a.prod||b.freq-a.freq},
  {id:'core', name:'Core nouns', ico:'●',
   desc:'Single words, most common first.',
   pick:w=>!w.parts.length, sort:(a,b)=>b.freq-a.freq},
  {id:'compound', name:'Compound words', ico:'⬢',
   desc:'Words built from two others. Every answer shows the pieces.',
   pick:w=>w.parts.length>0, sort:(a,b)=>b.freq-a.freq},
  {id:'all', name:'Everything', ico:'◆',
   desc:'All nouns mixed together.', pick:()=>true, sort:(a,b)=>b.freq-a.freq},
 ]},
 {id:'adj', name:'Adjectives', sub:'Vocabulary · Adjectives', pick:w=>w.wc==='adj', lanes:[
  {id:'colour', name:'Colours', ico:'◐',
   desc:'Basic colours, plus ljós- and dökk- to shade them.',
   pick:w=>w.tags.includes('colour'), sort:(a,b)=>b.freq-a.freq},
  {id:'people', name:'Describing people', ico:'☺',
   desc:'Funny, lazy, tall, kind.',
   pick:w=>w.tags.includes('people'), sort:(a,b)=>b.freq-a.freq},
  {id:'object', name:'Describing things', ico:'▣',
   desc:'Big, heavy, soft, cheap.',
   pick:w=>w.tags.includes('object'), sort:(a,b)=>b.freq-a.freq},
  {id:'feeling', name:'How you feel', ico:'♨',
   desc:'Hungry, tired, thirsty, nervous.',
   pick:w=>w.tags.includes('feeling'), sort:(a,b)=>b.freq-a.freq},
  {id:'adjall', name:'Everything', ico:'◆',
   desc:'All adjectives mixed together.', pick:()=>true, sort:(a,b)=>b.freq-a.freq},
 ]},
];
let theme=THEMES[0];
const pool=l=>W.filter(theme.pick).filter(l.pick).sort(l.sort);

/* ---------- state ---------- */
let view='menu', lane=null, queue=[], q=null, answered=false, chosen=null, last=null;
let session={asked:0, right:0, newly:[]};

function setBar(p){ $('bar').style.width=(p*100)+'%'; }
function pill(){
  const l=W.filter(w=>learnt(w.id)).length;
  $('pill').innerHTML=view==='play'
    ? `${session.right}/${session.asked} · <b>${l}</b> learnt`
    : `<b>${l}</b> / ${W.length} learnt`;
}

/* ---------- menu ---------- */
function drawMenu(){
  view='menu'; lane=null; $('back').hidden=true; setBar(0);
  const blocks=THEMES.map(th=>{
    const prev=theme; theme=th;
    const rows=th.lanes.map(l=>{
      const p=pool(l), done=p.filter(w=>learnt(w.id)).length;
      return `<button class="lane" data-theme="${th.id}" data-lane="${l.id}">
        <span class="ico">${l.ico}</span>
        <span class="t"><b>${esc(l.name)}</b><span>${esc(l.desc)}</span></span>
        <span class="n">${done}/${p.length}</span></button>`;
    }).join('');
    theme=prev;
    return `<div class="section">${esc(th.sub)}</div><div class="lanes">${rows}</div>`;
  }).join('');
  $('app').innerHTML=`<h1>Orðaleikur</h1>
    <p class="sub">Icelandic words. Pick the meaning — and when a word is built
    from smaller ones, see exactly which.</p>
    ${blocks}
    <div class="section">Later</div>
    <div class="lanes">
      <div class="lane locked"><span class="ico">◇</span>
        <span class="t"><b>Verbs</b><span>Not built yet</span></span></div>
      <div class="lane locked"><span class="ico">◇</span>
        <span class="t"><b>Everyday phrases</b><span>Ordering, feelings, describing things</span></span></div>
    </div>`;
  $('app').querySelectorAll('[data-lane]').forEach(b=>b.onclick=()=>{
    theme=THEMES.find(t=>t.id===b.dataset.theme);
    start(theme.lanes.find(l=>l.id===b.dataset.lane));
  });
  pill();
}

/* ---------- session ---------- */
function introHTML(){
  return `<div class="intro"><h2>How Icelandic adjectives work</h2>
    <p>An adjective changes shape to match the noun it describes. There are
    three genders, and each takes a different ending.</p>
    <div class="box"><div class="rt">the same adjective, three genders</div>
      <div class="agree">
        <div class="arow m"><span class="phrase"><b>rauður</b> bíll</span>
          <span class="gl">${esc(gname('m'))}</span><span class="mean">a red car</span></div>
        <div class="arow f"><span class="phrase"><b>rauð</b> rós</span>
          <span class="gl">${esc(gname('f'))}</span><span class="mean">a red rose</span></div>
        <div class="arow n"><span class="phrase"><b>rautt</b> hús</span>
          <span class="gl">${esc(gname('n'))}</span><span class="mean">a red house</span></div>
      </div></div>
    <p>Adjectives also come in three degrees, the same as English big / bigger / biggest.</p>
    <div class="box"><div class="rt">three degrees</div><div class="degrow">
      <div class="d"><b>gulur</b><span>${esc(dname(0))} — yellow</span></div>
      <div class="d mid"><b>gulari</b><span>${esc(dname(1))} — more yellow</span></div>
      <div class="d sup"><b>gulastur</b><span>${esc(dname(2))} — most yellow</span></div>
    </div></div>
    <p>You only have to recognise the meaning here. The forms are shown after
    each answer so they sink in on their own.</p>
    <button class="next" id="gotit">Start</button></div>`;
}

function start(l){
  lane=l; view='play'; $('back').hidden=false;
  if(theme.id==='adj' && !P.intro){
    $('app').innerHTML=introHTML();
    $('gotit').onclick=()=>{ P.intro=true; save(); start(l); };
    setBar(0); return;
  }
  session={asked:0,right:0,newly:[]};
  const p=pool(l);
  // Weakest and least-seen first, but never the same word twice running.
  queue=p.slice().sort((a,b)=>strength(a.id)-strength(b.id)||st(a.id).n-st(b.id).n)
        .slice(0,12);
  next();
}

function pickDistractors(w,n){
  const cand=w.d.filter(id=>byId[id]);
  const hard=strength(w.id)>=2;               // ramp difficulty with familiarity
  const band=hard?cand.slice(0,6):cand.slice(3,10);
  const src=(band.length>=n?band:cand).slice();
  const out=[];
  while(out.length<n && src.length) out.push(src.splice(Math.floor(Math.random()*src.length),1)[0]);
  let i=0;
  while(out.length<n && i<W.length){ const c=W[i++]; if(c.id!==w.id&&!out.includes(c.id)) out.push(c.id); }
  return out;
}

function next(){
  if(!queue.length) return summary();
  let w=queue.shift();
  if(w.id===last && queue.length){ queue.push(w); w=queue.shift(); }
  last=w.id;
  const opts=[w.id,...pickDistractors(w,3)];
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  q={w,opts,demo:{m:pickDemo('m'),f:pickDemo('f'),n:pickDemo('n')}};
  answered=false; chosen=null;
  drawQ();
}

function wordHTML(w){
  if(!w.parts.length) return `<span class="seg plain">${esc(w.id)}</span>`;
  const show=answered || w.parts.every(partKnown);
  if(!show) return `<span class="seg plain">${esc(w.id)}</span>`;
  return w.parts.map((p,n)=>(n?'<span class="seam"></span>':'')+
    `<span class="seg p${n%3}">${esc(p.surface)}</span>`).join('');
}

function drawQ(){
  const {w,opts}=q;
  const hint=!answered && w.parts.length && w.parts.every(partKnown)
    ? 'built from words you know' : '';
  $('app').innerHTML=`<div class="qword">${wordHTML(w)}</div>
    <div class="qhint">${hint}</div>
    <div class="opts">${opts.map(id=>
      `<button class="opt" data-id="${esc(id)}"><span class="lbl">${esc(glossOf(id))}</span>
       <span class="tag"></span></button>`).join('')}</div>
    <div id="after"></div>`;
  if(answered) paintAnswered();
  else $('app').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.id));
  setBar(session.asked/(session.asked+queue.length+1));
  pill();
}

function paintAnswered(){
  const {w}=q;
  $('app').querySelectorAll('.opt').forEach(b=>{
    b.disabled=true; b.onclick=null;
    b.classList.remove('right','wrong','faded');
    if(b.dataset.id===w.id){ b.classList.add('right'); b.querySelector('.tag').textContent=w.id; }
    else if(b.dataset.id===chosen){ b.classList.add('wrong');
      // Show what they actually picked, in Icelandic — a free second word.
      b.querySelector('.tag').textContent=b.dataset.id; }
    else { b.classList.add('faded');
      // Show the Icelandic for every option, so a round teaches four words.
      b.querySelector('.tag').textContent=b.dataset.id; }
  });
  $('app').querySelector('.qword').innerHTML=wordHTML(w);
  $('app').querySelector('.qhint').textContent='';
  $('after').innerHTML=breakdown(w)+`<button class="next" id="nx">Next</button>`;
  $('nx').onclick=next;
}

function answer(id){
  if(answered) return;
  answered=true; chosen=id;
  const {w}=q, right=id===w.id, s=st(w.id);
  s.n++;
  if(right){ s.k++; s.str=Math.min(5,s.str+1); session.right++; if(s.str===5) session.newly.push(w.id); }
  else{ s.k=0; s.str=Math.max(0,s.str-1); queue.push(w); }
  session.asked++; save();

  paintAnswered();
  pill();
}

function breakdown(w){
  let html='';
  if(w.wc==='adj'&&w.forms){
    const rows=[['m','kk'],['f','kvk'],['n','hk']].map(([g,k])=>{
      const n=q&&q.demo?q.demo[g]:pickDemo(g);
      const form=w.forms[k]||'—';
      return `<div class="arow ${g}">
        <span class="phrase"><b>${esc(form)}</b>${n?' '+esc(n.w):''}</span>
        <span class="gl">${esc(gname(g))}</span>
        ${n?`<span class="mean">${esc(P.lang==='de'?n.de:n.en)}</span>`:''}</div>`;
    }).join('');
    html+=`<div class="reveal"><div class="rt">agrees with the noun</div>
      <div class="agree">${rows}</div>
      ${w.deg&&w.deg[1]?`<div class="litc"><div class="degrow">
        ${[0,1,2].map(i=>`<div class="d ${i===1?'mid':i===2?'sup':''}">
          <b>${esc(w.deg[i]||'—')}</b><span>${esc(dname(i))}</span></div>`).join('')}
      </div></div>`:''}
      ${w.note?`<div class="note">${esc(w.note)}</div>`:''}</div>`;
  }
  if(w.parts.length){
    const pieces=w.parts.map((p,n)=>{
      const kn=p.lemma&&byId[p.lemma]&&known(p.lemma);
      const meaning=p[P.lang]||'';
      return `<div class="piece p${n%3}"><span class="w">${esc(p.lemma||p.surface)}</span>
        <span class="m">${esc(meaning)}</span>
        ${kn?'<span class="known">known</span>':''}</div>`;
    }).join('');
    const lit=w.parts.map(p=>p[P.lang]||p.surface).join(' + ');
    html+=`<div class="reveal"><div class="rt">built from</div>
      <div class="pieces">${pieces}</div>
      <div class="litc">literally <b>${esc(lit)}</b> — ${esc(gloss(w))}</div>
      ${w.wc!=='adj'&&w.note?`<div class="note">${esc(w.note)}</div>`:''}</div>`;
  }
  if(w.fam&&w.fam.length){
    html+=`<div class="reveal"><div class="rt">same family</div>
      ${w.fam.map(f=>`<div class="famrow ${esc(f.rel)}">
        <span class="fw">${esc(f.w)}</span><span class="fp">${esc(f.p)}</span>
        <span class="fm">${esc(P.lang==='de'?f.de:f.en)}</span></div>`).join('')}
      ${w.deriv?`<div class="deriv"><b>-${esc(w.deriv.suffix)}</b> ${esc(w.deriv.note)}</div>`:''}</div>`;
  }
  if(!w.parts.length&&!(w.fam&&w.fam.length)&&w.builds.length){
    html+=`<div class="reveal"><div class="rt">this word builds</div>
      <div class="builds">${w.builds.map(b=>
        `<b>${esc(b)}</b> ${esc(byId[b]?gloss(byId[b]):'')}`).join('<br>')}</div></div>`;
  }
  return html;
}

function summary(){
  view='summary'; setBar(1);
  const nw=session.newly;
  $('app').innerHTML=`<div class="sum"><h2>Vel gert</h2>
    <p>${nw.length?`${nw.length} new word${nw.length>1?'s':''} learnt: ${nw.map(esc).join(', ')}`:'Keep going — repetition is doing the work.'}</p>
    <div class="stats"><div class="ok"><b>${session.right}</b>correct</div>
      <div><b>${session.asked}</b>answered</div></div>
    <div class="row"><button id="again">Another round</button>
      <button id="menu">Back to menu</button>
      <button id="exp">Save / load progress</button></div>
    <div id="iobox"></div></div>`;
  $('again').onclick=()=>start(lane);
  $('menu').onclick=drawMenu;
  $('exp').onclick=io;
  pill();
}

function io(){
  $('iobox').innerHTML=`<textarea class="io" id="iot" spellcheck="false"></textarea>
    <div class="row" style="margin-top:8px"><button id="ld">Load from box</button></div>
    <div class="tiny">Copy this to move progress to another device, or paste some in and load it.</div>`;
  $('iot').value=JSON.stringify(P);
  $('ld').onclick=()=>{
    try{ const v=JSON.parse($('iot').value);
      if(v&&v.s){ P=Object.assign({lang:'de',s:{}},v); save(); drawMenu(); } }
    catch(e){ $('iot').value='could not read that — expected the JSON from this box'; }
  };
}

$('back').onclick=drawMenu;
$('lang').onclick=()=>{ P.lang=P.lang==='de'?'en':'de'; save();
  $('lang').innerHTML='glosses <b>'+P.lang.toUpperCase()+'</b>';
  if(view==='menu')drawMenu(); else if(view==='play')drawQ(); else summary(); };
$('reset').onclick=()=>{ if(confirm('Erase all progress?')){ P={lang:P.lang,intro:P.intro,s:{}}; save(); drawMenu(); } };
$('lang').innerHTML='glosses <b>'+P.lang.toUpperCase()+'</b>';
drawMenu();
</script>
